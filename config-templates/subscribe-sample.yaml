# proxy-providers:

  Podpiska:
    type: http
    url: 'сслыка на подписку'
    path: ./proxy-providers/podpiska.yaml
    interval: 600
    header:
      User-Agent: [happ/android]
      x-hwid: [hwid можно взять из настроек SSClash GO]
      x-device-os: [Android]
      x-ver-os: [16]
      x-device-model: [Pixel 11]   
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: 204 
